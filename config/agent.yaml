# Agent Manifest — AgentRegistry entry point for EDU-C2-043.
# Static discovery metadata lives here; runtime parameters live in config/config.yaml.
id: "EDU-C2-043"
name: "Student Support Case History Briefing Agent"
namespace: "agent1000"
version: "1.0.1"
enabled: true
category: "Cat 2"
generation_mode: "llm"
industry: "EDU"

# Opaque compatibility metadata; this is not an inheritance selector.
base_type: "AgentBaseGraph"

# AgentRegistry expects one dotted import path.
class: "src.graph.graph.Graph"

required_trust_level: "VERIFIED_EXTERNAL"

# Case-history and Azure OpenAI credentials are invocation-scoped.
requires:
  secrets:
    - "CASE_HISTORY_SERVICE_TOKEN"
    - "AZURE_OPENAI_API_KEY"
    - "AZURE_OPENAI_ENDPOINT"
    - "AZURE_OPENAI_DEPLOYMENT"
  extras: ["openai"]
