# Runtime parameters — loaded separately from config/agent.yaml and passed as
# Graph(config=...).
max_retry: 3
timeout_s: 60

# This workflow pauses at CounselorHandoffNode for authorized human review.
hitl:
  enabled: true
  max_hitl: 5
  max_wait_s: 86400
  type: "interrupt"
  gate_node: "counselor_handoff"

# HITL requires checkpoint persistence on both registry and standalone paths.
memory_enabled: true
llm_provider: "azure_openai"
memory:
  backend: "sqlite"

# Approved-source query bounds.
retrieval:
  max_events_per_source: 500
  max_approved_sources: 20
